<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade - Cadastro de Entrega</title>
</head>
<body>
    <h1 style="text-align: center; font-family: Impact">Cadastro de Entrega</h1>
    <form action="process_form.php" method="POST">

        <label for="id">Código:</label>
        <input type="text" id="id" name="id">

        <br><br>
        
        <label for="recipient">Destinatário:</label>
        <input type="text" id="recipient" name="recipient">

        <br><br>

        <label for="city">Cidade:</label>
        <input type="text" id="city" name="city">

        <br><br>

        <label for="weight">Peso (kg):</label>
        <input type="number" id="weight" name="weight" min="0" step="0.001">

        <br><br>

        <button type="submit" style="background-color: rgba(70, 0, 161, 0.5); color: white;">Enviar</button>
    </form>

</body>
</html>
